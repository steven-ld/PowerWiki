<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 - {{title}}</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f5f6f7;
            --card: #ffffff;
            --text: #1f2329;
            --secondary: #646a73;
            --accent: #3370ff;
            --border: #e5e6eb;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #17181a;
                --card: #1f2023;
                --text: #e8e9eb;
                --secondary: #a0a4ab;
                --accent: #5b8cff;
                --border: #303237;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }
        .not-found {
            width: min(520px, 100%);
            padding: 48px 40px;
            text-align: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
        }
        .not-found h1 {
            margin: 0 0 12px;
            font-size: 72px;
            line-height: 1;
            letter-spacing: -2px;
            color: var(--accent);
        }
        .not-found-description {
            margin: 0 0 28px;
            color: var(--secondary);
            font-size: 16px;
            line-height: 1.6;
        }
        .not-found-home {
            display: inline-block;
            padding: 10px 24px;
            color: #fff;
            background: var(--accent);
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
        }
        .not-found-home:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <main class="not-found">
        {{content}}
    </main>
</body>
</html>
